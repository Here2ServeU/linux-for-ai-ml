version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
    labels: [dependencies]

  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "devcontainer" }
    labels: [dependencies]
